services:
  - type: web
    name: tradebt15
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protrebot-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: PROTREBOT_WEB_REQUIRE_AUTH
        value: "true"
      - key: PROTREBOT_WEB_ACCESS_TOKEN
        sync: false
      - key: PROTREBOT_CORS_ORIGINS
        value: https://frontend-nu-two-18.vercel.app
      - key: APP_BASE_URL
        value: https://frontend-nu-two-18.vercel.app
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_EMAIL
        value: privacykais@gmail.com
      - key: GMAIL_FROM_NAME
        value: ProTreBot
      - key: PROTREBOT_EXPOSE_DEV_TOKENS
        value: "false"
      - key: PROTREBOT_DATA_DIR
        value: /tmp/protrebot-data
      - key: PROTREBOT_EXECUTION_MODE
        value: TESTNET_FIRST
      - key: PROTREBOT_PAPER_ENABLED
        value: "false"
      - key: PROTREBOT_LIVE_CHANNEL_ENABLED
        value: "true"
      - key: PROTREBOT_DEPLOYMENT_TIER
        value: "FREE_PREVIEW"
      - key: PROTREBOT_DURABLE_AUTH_REQUIRED
        value: "true"

databases:
  - name: protrebot-db
    plan: free
    region: frankfurt
    databaseName: protrebot
    user: protrebot
